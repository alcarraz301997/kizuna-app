# openspec/config.yaml — kizuna-app
# Generated by sdd-init on 2026-07-08

schema: spec-driven

context: |
  Project: kizuna-app — wedding expense management app
  Tech stack: Laravel 11 + React 18 + Inertia.js (monolith, server-side routing + SPA bridge)
  Multi-user: Couple (2 users) sharing a single wedding budget
  First version scope: Expenses CRUD + Categories CRUD
  Testing: PHPUnit (Laravel), Vitest + React Testing Library (React)
  State: Greenfield — no code scaffolded yet (declared stack, not file-detected)

# Session preflight choices
session:
  execution_mode: interactive
  artifact_store: openspec
  pr_strategy: ask-always
  review_budget_lines: 800

rules:
  proposal:
    - Include rollback plan for risky changes
    - Scope to MVP (expenses + categories) for first version
    - Declare impact on existing domains (none expected for greenfield v1)
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Model the couple's 2-user constraint in auth/ownership scenarios
  design:
    - Document architecture decisions with rationale
    - Map Inertia.js page components to Laravel routes/controllers
    - Specify Eloquent models, migrations, and relationships
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - Separate backend (Laravel) and frontend (React/Inertia) tasks clearly
  apply:
    - Follow Laravel conventions (Artisan commands, migrations, factories)
    - Follow existing code patterns once code exists
    tdd: false
    test_command: "php artisan test && npm run test"
  verify:
    test_command: "php artisan test && npm run test"
    build_command: "npm run build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas

# Testing capabilities — planned for Laravel + React + Inertia.js stack.
# Project is greenfield: capabilities are DECLARED, not file-detected.
# Revisit strict_tdd after scaffolding (set to true once PHPUnit + Vitest run).
testing:
  strict_tdd: false
  detected: 2026-07-08
  status: declared-greenfield
  note: >
    No code scaffolded yet. Capabilities reflect the intended
    Laravel + React + Inertia.js stack. Set strict_tdd to true
    after `composer create-project` and `npm install` confirm
    PHPUnit and Vitest execute successfully.

  runner:
    backend:
      command: "php artisan test"
      framework: "PHPUnit (via Laravel)"
    frontend:
      command: "npm run test"
      framework: "Vitest"

  layers:
    unit:
      backend: "PHPUnit"
      frontend: "Vitest"
    integration:
      backend: "Laravel Feature tests (Tests\\TestCase)"
      frontend: "React Testing Library (@testing-library/react)"
    e2e:
      status: planned
      tool: "Playwright (to be added in a later change)"

  coverage:
    backend: "php artisan test --coverage"
    frontend: "vitest run --coverage"

  quality:
    linter: "Laravel Pint (PHP) / ESLint (JS)"
    type_checker: "PHPStan + Larastan (PHP) / TypeScript tsc (if TS)"
    formatter: "Laravel Pint (PHP) / Prettier (JS)"
