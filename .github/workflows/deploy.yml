name: Deploy to Hostinger

on:
  push:
    branches:
      - main
      - deploy
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, bcmath, zip, gd
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Node Dependencies & Build Assets
        run: |
          npm ci
          npm run build

      - name: Deploy via SSH to Hostinger
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 65002 }}
          script: |
            cd ${{ secrets.HOSTINGER_PROJECT_PATH }}

            # Detectar binario de PHP 8.3 en Hostinger
            if command -v /usr/bin/php8.3 &> /dev/null; then
              PHP_BIN="/usr/bin/php8.3"
            elif command -v /usr/local/php83/bin/php &> /dev/null; then
              PHP_BIN="/usr/local/php83/bin/php"
            elif command -v /opt/alt/php83/usr/bin/php &> /dev/null; then
              PHP_BIN="/opt/alt/php83/usr/bin/php"
            elif command -v php8.3 &> /dev/null; then
              PHP_BIN="php8.3"
            else
              PHP_BIN="php"
            fi

            echo "Using PHP binary: $($PHP_BIN -v | head -n 1)"

            # Activar modo mantenimiento
            $PHP_BIN artisan down || true

            # Asegurar repositorio (auto-clonación si la carpeta estaba vacía)
            if [ ! -d .git ]; then
              echo "Inicializando repositorio Git en el servidor..."
              git init
              git remote add origin https://github.com/alcarraz301997/kizuna-app.git || git remote set-url origin https://github.com/alcarraz301997/kizuna-app.git
              git fetch origin main
              git reset --hard origin/main
              git branch -M main
            else
              # Obtener últimos cambios
              git pull origin main
            fi

            # Instalar dependencias de producción en PHP con PHP 8.3
            $PHP_BIN $(which composer) install --no-dev --no-interaction --prefer-dist --optimize-autoloader

            # Compilar assets en el servidor (si cuenta con Node)
            if command -v npm &> /dev/null; then
              npm ci --production=false
              npm run build
            fi

            # Ejecutar migraciones
            $PHP_BIN artisan migrate --force

            # Enlazar storage si no existe
            $PHP_BIN artisan storage:link || true

            # Limpiar y regenerar cachés para máximo rendimiento
            $PHP_BIN artisan optimize:clear
            $PHP_BIN artisan optimize
            $PHP_BIN artisan view:cache

            # Desactivar modo mantenimiento
            $PHP_BIN artisan up
